name: Live integration

# The SDK against production's "PHP SDK CI" website, with its own
# least-privilege site key (tests/Integration/LiveApiTest.php says what it
# writes and cleans up). On a schedule, by hand, and before every release
# (scripts/release.sh --push refuses a commit without a green run). Never on
# pull requests: secrets must not reach a fork's code.

on:
  workflow_dispatch:
  # Once a day, at an odd minute to miss the top-of-hour rush. Scheduled runs
  # use main, the only branch the live-integration environment allows.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

# One run at a time: they share the CI index.
concurrency:
  group: live-integration
  cancel-in-progress: false

jobs:
  live:
    if: github.repository == 'instafind-io/instafind-php-sdk'
    runs-on: ubuntu-latest
    # Deployment branches: main only.
    environment: live-integration
    timeout-minutes: 15
    steps:
      # Pinned: this job holds a production key.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: curl, json
          coverage: none
      # No Composer packages next to the key: the SDK needs none, and PHPUnit
      # is a PHAR pinned by checksum (signed by Sebastian Bergmann, key
      # D8406D0D82947747293778314AA394086372C20A, checked 2026-11-27).
      - name: Autoloader and PHPUnit
        run: |
          composer dump-autoload --no-interaction
          curl -sSfLo phpunit.phar https://phar.phpunit.de/phpunit-10.5.67.phar
          echo "0635a0a340df88ea3a2c4e726a0df14160fbb542550a36cbda70921dbd756f95  phpunit.phar" | sha256sum -c -
      - name: Live API
        env:
          INSTAFIND_CI_API_KEY: ${{ secrets.INSTAFIND_CI_API_KEY }}
          INSTAFIND_CI_WEBSITE_ID: ${{ secrets.INSTAFIND_CI_WEBSITE_ID }}
          INSTAFIND_CI_BASE_URL: ${{ secrets.INSTAFIND_CI_BASE_URL }}
          # The search host shops use; the platform host answers the same paths.
          INSTAFIND_CI_PUBLIC_BASE_URL: ${{ vars.INSTAFIND_CI_PUBLIC_BASE_URL || 'https://s.instafind.io' }}
          # The reused CI index; the API cannot look it up by name.
          INSTAFIND_CI_INDEX_ID: ${{ vars.INSTAFIND_CI_INDEX_ID }}
        run: |
          if [[ -z "$INSTAFIND_CI_API_KEY" ]]; then
            echo "::error::The INSTAFIND_CI_API_KEY secret is missing."
            exit 1
          fi
          php phpunit.phar --testsuite integration --fail-on-skipped
