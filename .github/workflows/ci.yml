name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the SDK supports, and the newest PHP.
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite unit
      - name: OpenAPI contract (openapi/instafind-v1.json)
        run: vendor/bin/phpunit --testsuite contract

  static:
    name: PHPStan and php-cs-fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, json
          coverage: none
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: php-cs-fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  changelog:
    name: Changelog and version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fragments merge cleanly
        run: scripts/changelog-fragments.sh changelog.d
      - name: Nothing under Unreleased in CHANGELOG.md
        run: |
          if scripts/changelog-section.sh Unreleased CHANGELOG.md 2>/dev/null; then
            echo "::error::Lines under Unreleased in CHANGELOG.md belong in a file in changelog.d."
            exit 1
          fi
      - name: Sdk::VERSION is SemVer
        run: |
          grep -qE "public const VERSION = '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-dev)?';" src/Sdk.php
      - name: Shell scripts
        run: shellcheck scripts/*.sh
